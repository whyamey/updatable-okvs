[package]
name = "mkse"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
multimap = "0.8.3"
rand = "0.8.5"
chacha20 = "0.9.1"
frodo-pir = { git = "https://github.com/whyamey/frodo-pir", version = "0.0.1" }
base64 = "0.22.1"
log = "0.4.22"
bincode = "1.3.3"
chrono = "0.4.38"
log4rs = "1.3.0"
cipher = { version = "0.4.4", features = ["std"] }
sonic-rs = "0.3.17"
tikv-jemallocator = "0.6.0"
dashmap = "6.1.0"
rayon = "1.12.0"
blake3 = { version = "1.8.5", features = ["rayon"] }
# hintless PIR for the paired evaluation: our faster Spiral server and the Blyss client
spiral_fast = { path = "spiral_fast" }
spiral-rs = { git = "https://github.com/blyssprivacy/sdk", rev = "fdb7206517c249603b0c91b65f1f29f95272107c", features = ["server"] }
