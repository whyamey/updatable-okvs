[package]
name = "pir_compare"
version = "0.1.0"
edition = "2021"
description = "Measures the FrodoPIR fork used in the paper against upstream FrodoPIR (hint updates, batched answers, client preprocessing)."

[dependencies]
# optimized fork used by the paper (batched answers, SIMD, incremental hint updates)
frodo_fork = { package = "frodo-pir", git = "https://github.com/whyamey/frodo-pir", rev = "c008122" }
# upstream FrodoPIR at the commit the fork branched from (brave-experiments PR #15)
frodo_up = { package = "frodo-pir", git = "https://github.com/whyamey/frodo-pir", rev = "1557396" }
rand = "0.8.5"
base64 = "0.13"
bincode = "1.3.3"

[profile.release]
lto = "fat"
codegen-units = 1
